name: Desktop (Windows)

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "web/**"
      - "desktop/**"
      - ".github/workflows/desktop.yml"

permissions:
  contents: write

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # web/package-lock.json is not kept in sync (the project uses bun) and only pins Linux native binaries
      # (rollup / lightningcss / tailwind oxide), so resolve fresh without it to get the Windows natives.
      - name: Install web dependencies
        working-directory: web
        run: npm install --legacy-peer-deps --no-package-lock --no-audit --no-fund

      - name: Build web
        working-directory: web
        run: npm run build

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci --no-audit --no-fund

      - name: Check desktop sources
        working-directory: desktop
        run: npm run check

      - name: Build installer and portable zip
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --win --x64 --publish never

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: HemosiTV-windows-x64
          path: |
            desktop/release/*.exe
            desktop/release/*.zip
          if-no-files-found: error
          retention-days: 30

      # A pushed v* tag publishes a GitHub Release with the installer and portable zip.
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/release/*.exe
            desktop/release/*.zip
          body_path: RELEASE_NOTES.md
          prerelease: ${{ contains(github.ref_name, '-') }}
