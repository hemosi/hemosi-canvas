<style>

[data-lod=mid] .xm{display:none}[data-lod=low] .xm,[data-lod=low] .xl{display:none}[data-lod=low] .no{font-size:26px}[data-lod=low] .nh b,[data-lod=low] .ct b{font-size:20px}[data-lod=low] .node .chip{display:none}

.comp{padding:10px 12px;border-top:1px solid var(--st);display:flex;flex-direction:column;gap:7px}.refs{display:flex;gap:5px;flex-wrap:wrap}.ref{font-size:10.5px;padding:2px 6px;border-radius:5px;border:1px solid var(--st);background:var(--card)}

.bd{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:40}.bd.on{display:flex}.md{width:min(440px,92vw);background:var(--panel);border:1px solid var(--st);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px}.kv{display:flex;justify-content:space-between;gap:10px;font-size:11px}.kv span:first-child{color:var(--mu)}#cap{width:60px;background:var(--card);border:1px solid var(--st);border-radius:6px;padding:2px 6px;outline:none}
@media(max-width:820px){#agent{display:none}}
</style></head><body>
<header class="top"><div class="r g8"><button class="fb">‹ 项目</button><b style="font-size:13px">雨夜破庙</b><span class="chip">已保存</span></div><div class="r g8"><div class="seg" id="mseg"></div><button class="fb" onclick="fit()">适应窗口</button><button class="fb" onclick="document.getElementById('agent').style.display=document.getElementById('agent').style.display==='none'?'':'none'">Agent 面板</button></div></header>
<div id="ap" class="ap"></div><div class="ws"><main id="stage" data-lod="hi"><div id="board"><svg id="wires"></svg><div id="nodes"></div></div>
<div class="hint">拖空白处平移 · 滚轮平移 · ⌘/Ctrl＋滚轮缩放 · 点一镜展开</div>
<div class="zb"><button class="fb s" onclick="zoomBy(.85)">－</button><button class="fb s" id="zv" onclick="fit()">100%</button><button class="fb s" onclick="zoomBy(1.18)">＋</button></div>

<section class="pane" id="p-props"></section>
<div class="comp"><div class="refs" id="refs"></div><textarea rows="2" placeholder="写分镜、改某一镜…选中的镜头会自动作为引用"></textarea><div class="r sb"><span class="fa" style="font-size:10.5px">只出方案，确认后才写入</span><button class="pb" onclick="toast('Agent 会先在画布上给出幽灵预览')">发送</button></div></div></aside></div>
<div class="bd" id="cf"></div><div id="toast"></div>
<script>
const $=s=>document.querySelector(s),pad=n=>String(n+1).padStart(2,"0"),esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const A=[{id:"a1",t:"女主 · 红披风",k:"角色",c:["#7f1d1d","#b45309"]},{id:"a2",t:"守庙人 · 青衣",k:"角色",c:["#134e4a","#1e3a8a"]},{id:"a3",t:"雨夜破庙",k:"场景",c:["#1c1917","#57534e"]}];
const G=[["#7c2d12","#1c1917"],["#0f766e","#1e3a8a"],["#4c1d95","#1c1917"],["#334155","#0f172a"],["#92400e","#1c1917"],["#065f46","#1e293b"]];
const SL={ok:["已出","ok"],stale:["过期","warn"],error:["失败","bad"],loading:["生成中","run"],idle:["未生成",""]};
let S=[
{id:"s1",desc:"雨夜破庙门口，女主红披风背影推门半开，烛火摇曳，冷雨打在门槛上",line:"“别开门……”",dur:6,size:"全景",roles:["a1","a3"],voice:"后期配音",mode:"首帧",cont:false,f:"ok",v:"ok",ver:[2,2]},
{id:"s2",desc:"守庙人青衣转身竖起食指噤声，烛光打在两人侧脸，空气凝重",line:"“外面不是人，别出声，不管它喊谁的名字，千万别应。”",dur:4,size:"中景",roles:["a1","a2","a3"],voice:"后期配音",mode:"首帧",cont:false,f:"ok",v:"ok",ver:[3,3]},
{id:"s3",desc:"接上一镜：女主后退半步，手按刀柄，门缝外闪过白影",line:"",dur:5,size:"近景",roles:["a1","a3"],voice:"无",mode:"首帧",cont:true,f:"stale",v:"stale",ver:[1,1]},
{id:"s4",desc:"门缝特写，一只苍白的手指慢慢伸进来",line:"",dur:5,size:"特写",roles:["a3"],voice:"无",mode:"直出",cont:false,f:"idle",v:"error",ver:[0,0],det:true},
{id:"s5",desc:"烛火骤灭，黑暗里只听见门轴吱呀声",line:"“它进来了。”",dur:6,size:"中景",roles:["a1","a3"],voice:"后期配音",mode:"首帧",cont:false,f:"loading",v:"idle",ver:[0,0]}];
const GH={id:"g6",ghost:1,desc:"女主回头，半张脸被烛光照亮，眼神惊惧",line:"",dur:4,size:"特写",roles:["a1","a3"],voice:"无",mode:"首帧",cont:false,f:"idle",v:"idle",ver:[0,0]};
const NEWLINE="“今晚，门外的都不该应。”",OLD=S[1].line;
let P={state:"pending",add:true,edit:true},sel="s2",bk=null,cam={x:30,y:10,k:1};
const H=60,E=262,DX=250,DW=600,FX=900,VX=1120,NW=200,TOP=40;
const rows=()=>P.state==="pending"&&P.add?[...S,GH]:S;
const est=s=>+(s.line.replace(/[“”…，。！？\s]/g,"").length/4.2).toFixed(1);
const over=s=>s.voice==="后期配音"&&s.line&&est(s)>s.dur;
const tag=s=>s.ghost?'<span class="chip ac">新增</span>':s.id==="s2"&&P.state==="pending"&&P.edit?'<span class="chip ac">改台词</span>':s.det?'<span class="chip warn">已脱离</span>':"";
function nodeH(s,i,k,x,y,h,e){
 const st=s[k],isf=k==="f",[sl,sc]=SL[st],g=G[i%G.length],lab=`镜 ${pad(i)} · ${isf?"首帧":"视频"}`;
 const cl=`node ${s.ghost?"gh":""} ${e?"":"c"} ${st==="error"?"err":st==="stale"?"stl":""}`,at=`data-row="${s.id}" style="left:${x}px;top:${y}px;width:${NW}px;height:${h}px"`;
 const sw=`<div class="sw" style="background:linear-gradient(135deg,${g[0]},${g[1]})">${!isf&&(st==="ok"||st==="stale")?"▶":""}</div>`;
 if(!e)return `<div class="${cl}" ${at}>${st==="error"||st==="idle"||st==="loading"?'<div class="sw" style="background:var(--soft)"></div>':sw}<div class="ct"><b style="font-size:11px">${lab}</b><span class="chip ${sc}">${sl}</span></div></div>`;
 let mid=sw;
 if(st==="error")mid=`<div class="err">内容审核未通过<br><span>手部特写触发限制，改提示词后重试</span></div>`;
 else if(st==="idle")mid=`<span>${isf&&s.cont?"接续：取镜 "+pad(i-1)+" 末帧":"还没生成"}</span>`;
 else if(st==="loading")mid=`<span>生成中…</span><div class="bar"><i></i></div>`;
 const ft=st==="stale"?`<button class="wb s" onclick="regen('${s.id}')">重生</button>`:st==="error"?`<button class="wb s e" onclick="regen('${s.id}')">重试</button>`:"";
 const left=st==="ok"||st==="stale"?`<span class="ver"><button>‹</button>${s.ver[0]}/${s.ver[1]}<button>›</button></span>`:(!isf&&s.det?'<span class="chip warn">已脱离</span>':'<span class="fa">同步自导演台</span>');
 return `<div class="${cl}" ${at}><div class="nh"><b>${lab}</b><span class="chip ${sc}">${sl}</span></div><div class="nb" style="height:${h-66}px">${mid}</div><div class="nf">${left}${!isf&&s.q?`<span class='chip ok'>质检 ${s.q}${s.rt?' · 重试'+s.rt:''}</span>`:''}${ft}</div></div>`;
}
function rowH(s,i,e){
 const pip=t=>`<i class="pip ${t}"></i>`;
 const head=`<div class="rh"><span class="grip">⋮⋮</span><b class="no">镜 ${pad(i)}</b><span class="dsc xl">${esc(s.desc)}</span><span class="mu xm">${s.dur}s · ${s.size}</span><span class="roles xm">${A.filter(a=>s.roles.includes(a.id)).map(a=>`<i class="rc" style="--c:${a.c[1]}">${a.t[0]}</i>`).join("")}</span>${over(s)?'<span class="chip bad xm">配音超时</span>':""}<span class="xm">${tag(s)}</span><span class="pips">${s.mode==="首帧"?pip(s.f)+"<u></u>":""}${pip(s.v)}</span></div>`;
 if(!e)return head;
 const opt=(arr,v)=>arr.map(x=>`<option ${x===v?"selected":""}>${x}</option>`).join("");
 const diff=s.id==="s2"&&P.state==="pending"&&P.edit?`<div class="diff"><s>${esc(OLD)}</s><br>${NEWLINE}</div>`:"";
 return head+`<div class="rb"><div class="col"><label>画面</label><textarea rows="3" onchange="ed('${s.id}','desc',this.value)">${esc(s.desc)}</textarea><label>台词<span id="est" class="${over(s)?"bad":""}">${estTxt(s)}</span></label><textarea rows="2" placeholder="无台词" oninput="live('${s.id}',this.value)" onchange="ed('${s.id}','line',this.value)">${esc(s.line)}</textarea>${diff}</div>
 <div class="col2"><label>对白</label><select onchange="ed('${s.id}','voice',this.value)">${opt(["视频原生","后期配音","无"],s.voice)}</select><label>生成方式</label><div class="seg"><button class="${s.mode==="首帧"?"on":""}" onclick="ed('${s.id}','mode','首帧')">首帧→视频</button><button class="${s.mode==="直出"?"on":""}" onclick="ed('${s.id}','mode','直出')">直出</button></div>
 ${i>0&&s.mode==="首帧"?`<div class="r g8"><button class="sw2 ${s.cont?"on":""}" onclick="ed('${s.id}','cont',${!s.cont})"></button><span>接续镜 ${pad(i-1)} 末帧</span></div>`:""}
 <label>出镜（悬停可见连线）</label><div class="r g4">${A.map(a=>`<button class="rc2 ${s.roles.includes(a.id)?"on":""}" style="--c:${a.c[1]}" title="${a.t}" onclick="role('${s.id}','${a.id}')">${a.t[0]}</button>`).join("")}</div></div></div>`;
}
const estTxt=s=>s.voice==="后期配音"&&s.line?`配音约 ${est(s)}s / 镜头 ${s.dur}s`:s.voice==="视频原生"?"视频自带声音":"";
function R(){
 const rs=rows(),L=[],pos={};let y=44;
 rs.forEach(s=>{const e=s.id===sel;L.push({s,y,h:e?E:H,e});y+=e?E:H});
 let o=A.map((a,i)=>`<div class="anc" data-a="${a.id}" style="left:0;top:${TOP+i*172}px;width:200px;height:150px"><div class="nh"><b>${a.t}</b><span class="chip">${a.k}</span></div><div class="sw wide" style="background:linear-gradient(135deg,${a.c[0]},${a.c[1]})"></div><div class="nf"><span>已锁定</span><span>${rs.filter(s=>s.roles.includes(a.id)).length} 镜使用</span></div></div>`).join("");
 const tot=S.reduce((a,s)=>a+s.dur,0)+(P.state==="pending"&&P.add?GH.dur:0),vd=S.filter(s=>s.v==="ok").length,stl=S.filter(s=>s.v==="stale"||s.f==="stale").length;
 o+=`<div class="desk" id="desk" style="left:${DX}px;top:${TOP}px;width:${DW}px;height:${y}px"><div class="dh"><div class="r g8"><b>导演台</b><span class="chip ${tot>30?"bad":"ac"}">${tot} / 30 秒</span><span class="chip">${vd}/${S.length} 有视频</span></div><div class="r g4"><button class="fb s" onclick="addShot()">＋ 加一镜</button>${stl?`<button class="wb s" onclick="regenAll()">重生过期 ${stl}</button>`:""}<button class="pb" style="padding:3px 9px" onclick="goBtn()">${MODES[mode][0]}</button></div></div>`;
 L.forEach(({s,y:ly,h,e},i)=>{o+=`<div class="row ${e?"on":""} ${s.ghost?"gh":""}" data-r="${s.id}" style="height:${h}px" onclick="rowClick(event,'${s.id}')">${rowH(s,i,e)}</div>`});
 o+="</div>";
 L.forEach(({s,y:ly,h,e},i)=>{const ry=TOP+ly,nh=e?E-14:H-10,ny=ry+(e?7:5);pos[s.id]={mid:ry+30,ny,nh};
  if(s.mode==="首帧")o+=nodeH(s,i,"f",FX,ny,nh,e);o+=nodeH(s,i,"v",VX,ny,nh,e)});
 let w="";const cv=(x1,y1,x2,y2,c,a)=>{const d=(x2-x1)/2;return `<path class="w ${c}" ${a} d="M${x1} ${y1}C${x1+d} ${y1},${x2-d} ${y2},${x2} ${y2}"/>`};
 rs.forEach(s=>{const p=pos[s.id],c=p.ny+p.nh/2,g=s.ghost?"g":"",at=`data-r="${s.id}"`;
  A.forEach((a,ai)=>{if(s.roles.includes(a.id))w+=cv(200,TOP+ai*172+75,DX,p.mid,"",`${at} data-a="${a.id}"`)});
  if(s.mode==="首帧")w+=cv(DX+DW,p.mid,FX,c,g,at)+cv(FX+NW,c,VX,c,g,at);else w+=cv(DX+DW,p.mid,VX,c,g,at)});
 rs.forEach((s,i)=>{if(s.cont&&i>0){const a=pos[rs[i-1].id],b=pos[s.id];w+=`<path class="w c" data-r="${s.id}" d="M${VX+100} ${a.ny+a.nh}C${VX+100} ${a.ny+a.nh+50},${FX+100} ${b.ny-50},${FX+100} ${b.ny}"/>`}});
 $("#nodes").innerHTML=o;$("#wires").innerHTML=w;$("#board").style.height=(TOP+y+120)+"px";
 $("#tl").innerHTML=rs.map((s,i)=>`<div class="seg2 ${s.v} ${s.id===sel?"cur":""} ${s.ghost?"gh":""} ${over(s)?"ov":""}" style="flex:${s.dur}" title="镜 ${pad(i)} · ${s.dur}s" onclick="pick('${s.id}')">${pad(i)}</div>`).join("");
 $("#tt").textContent=tot+"s";refs();PR();PC();
}
function hv(id){
 document.querySelectorAll("#wires path").forEach(p=>{p.classList.toggle("hl",!!id&&p.dataset.r===id);p.classList.toggle("dim",!!id&&p.dataset.r!==id)});
 document.querySelectorAll(".node").forEach(n=>n.classList.toggle("dim",!!id&&n.dataset.row!==id));
 const s=rows().find(x=>x.id===id);
 document.querySelectorAll(".anc").forEach(a=>a.classList.toggle("dim",!!id&&!(s&&s.roles.includes(a.dataset.a))));
 document.querySelectorAll(".row").forEach(r=>r.classList.toggle("hv",r.dataset.r===id));
}
$("#board").addEventListener("mouseover",e=>{const t=e.target.closest("[data-r],[data-row]");hv(t?(t.dataset.r||t.dataset.row):null)});
$("#board").addEventListener("mouseleave",()=>hv(null));
function rowClick(e,id){if(e.target.closest("textarea,select,button,input"))return;sel=id;R()}
function pick(id){sel=id;R()}
function ed(id,k,v){const s=rows().find(x=>x.id===id);if(!s)return;s[k]=v;if((k==="desc"||k==="line")&&s.v==="ok")s.v="stale";if(k==="mode"&&v==="直出"){s.cont=false;s.f="idle"}R()}
function live(id,v){const s=rows().find(x=>x.id===id),t=$("#est");if(!s||!t)return;const c={...s,line:v};t.textContent=estTxt(c);t.className=over(c)?"bad":""}
function role(id,a){const s=rows().find(x=>x.id===id);s.roles=s.roles.includes(a)?s.roles.filter(x=>x!==a):[...s.roles,a];R()}
function regen(id){const s=S.find(x=>x.id===id);toast(`弹出确认卡：重生镜 ${pad(S.indexOf(s))}，显示模型、渠道和完整提示词`)}
function regenAll(){toast("确认卡：一次确认所有过期节点，接续镜头等上一镜出片后才提交")}
function addShot(){S.push({id:"s"+(S.length+7),desc:"",line:"",dur:5,size:"中景",roles:["a3"],voice:"无",mode:"首帧",cont:false,f:"idle",v:"idle",ver:[0,0]});sel=S[S.length-1].id;R();toast("新增一镜：右侧自动接出首帧 → 视频，并连好设定图")}
function refs(){const s=rows().find(x=>x.id===sel);$("#refs").innerHTML=s?`<span class="ref">@镜 ${pad(rows().indexOf(s))}</span>`+A.filter(a=>s.roles.includes(a.id)).map(a=>`<span class="ref">@${a.t.split(" ")[0]}</span>`).join(""):""}
function PR(){const i=rows().findIndex(x=>x.id===sel),s=rows()[i];if(!s){$("#p-props").innerHTML="";return}
 const eff=`${s.desc}；出镜：${A.filter(a=>s.roles.includes(a.id)).map(a=>a.t.split(" ")[0]).join("、")}；景别：${s.size}；时长 ${s.dur}s；竖屏 9:16`;
 const vs=s.ver[1]?Array.from({length:s.ver[1]},(_,j)=>`<div class="sw" style="width:36px;height:64px;background:linear-gradient(135deg,${G[i%6][0]},${G[i%6][1]});outline:${j+1===s.ver[0]?"2px solid var(--ac)":"none"}"></div>`).join(""):'<span class="fa">还没有版本</span>';
 $("#p-props").innerHTML=`<div class="r sb"><b>镜 ${pad(i)} · 属性</b><span class="chip ${SL[s.v][1]}">${SL[s.v][0]}</span></div><div class="lb">导演台原文</div><div class="box">${esc(s.desc)}</div>
 <div class="lb"><span>实际发给模型的提示词</span>${s.det?'<button class="wb s" onclick="toast(\'已恢复同步：下游提示词改回导演台的写法\')">恢复同步</button>':'<span class="chip ok">同步中</span>'}</div><div class="box">${esc(s.det?"（节点里手改过）手指从门缝伸入，特写，冷色调，低饱和；"+s.desc:eff)}</div>
 ${s.det?'<div class="fa">已脱离：导演台和 Agent 的改动不会覆盖这个节点。</div>':""}
 <div class="lb">模型</div><div class="box">首帧 Seedream 4 · 视频 Seedance 1.0 · 1080×1920</div><div class="lb">版本（点选采用）</div><div class="r g8">${vs}</div>`}
function tab(t){document.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("on",b.dataset.t===t));$("#p-chat").classList.toggle("on",t==="chat");$("#p-props").classList.toggle("on",t==="props")}
function PC(){const c=$("#plan");
 if(P.state==="applied"){c.innerHTML=`<b>改动方案</b> <span class="chip ok">已应用</span><div class="mu" style="margin:4px 0 6px">已写入所选改动。镜 02 的视频提示词变了，已标为“过期”，需要你手动重生。</div><button class="fb s" onclick="undo()">撤销（⌘/Ctrl+Z）</button>`;return}
 if(P.state==="rejected"){c.innerHTML=`<b>改动方案</b> <span class="chip">没采用</span><div class="mu" style="margin-top:4px">画布没动，可以接着说想怎么改。</div>`;return}
 c.innerHTML=`<b>改动方案</b> <span class="mu">· 画布上已显示预览，勾选决定采纳哪些</span>
 <label class="chg m"><input type="checkbox" ${P.edit?"checked":""} onchange="P.edit=this.checked;R()"><span class="k">改</span><div>镜 02 台词<br><s>${esc(OLD)}</s><br>${NEWLINE}<div class="fa">配音 5.2s → 2.4s，不再超出镜头 4s</div></div></label>
 <label class="chg a"><input type="checkbox" ${P.add?"checked":""} onchange="P.add=this.checked;R()"><span class="k">加</span><div>镜 06 · 4s · 特写 · 首帧→视频<br>女主回头，半张脸被烛光照亮<div class="fa">新建 1 首帧 + 1 视频，连好设定图 · 总长 26 → 30 / 30 秒</div></div></label>
 <div class="fa" style="margin:6px 0">镜 04 已脱离，不会被覆盖。</div><div class="r g4"><button class="pb" style="flex:1" onclick="apply()">应用所选</button><button class="gb" onclick="P.state='rejected';R()">不要</button></div>`}
function apply(){bk=JSON.stringify(S);if(P.edit){S[1].line=NEWLINE;if(S[1].v==="ok")S[1].v="stale"}
 if(P.add){const n={...GH,id:"s6"};delete n.ghost;S.push(n)}P.state="applied";R();toast("已写入所选改动，一次撤销即可全部回退")}
function undo(){if(!bk||P.state!=="applied")return;S=JSON.parse(bk);P.state="pending";R();toast("已撤销")}
addEventListener("keydown",e=>{if((e.metaKey||e.ctrlKey)&&e.key==="z"&&!e.target.closest("textarea,input")){e.preventDefault();undo()}if(e.shiftKey&&e.key==="!")fit()});
/* camera */
const st=$("#stage");
function camApply(){$("#board").style.transform=`translate(${cam.x}px,${cam.y}px) scale(${cam.k})`;st.dataset.lod=cam.k<.45?"low":cam.k<.8?"mid":"hi";st.style.backgroundPosition=`${cam.x}px ${cam.y}px`;st.style.backgroundSize=`${22*cam.k}px ${22*cam.k}px`;$("#zv").textContent=Math.round(cam.k*100)+"%"}
function zoomAt(f,px,py){const k=Math.min(1.6,Math.max(.2,cam.k*f)),r=k/cam.k;cam.x=px-(px-cam.x)*r;cam.y=py-(py-cam.y)*r;cam.k=k;camApply()}
function zoomBy(f){zoomAt(f,st.clientWidth/2,st.clientHeight/2)}
function fit(){const h=TOP+44+rows().reduce((a,s)=>a+(s.id===sel?E:H),0)+60,k=Math.min((st.clientWidth-40)/1340,(st.clientHeight-70)/h,1);cam.k=k;cam.x=(st.clientWidth-1340*k)/2;cam.y=14;camApply()}
st.addEventListener("wheel",e=>{e.preventDefault();const r=st.getBoundingClientRect();if(e.ctrlKey||e.metaKey)zoomAt(Math.exp(-e.deltaY*.01),e.clientX-r.left,e.clientY-r.top);else{cam.x-=e.deltaX;cam.y-=e.deltaY;camApply()}},{passive:false});
let pan=null;st.addEventListener("pointerdown",e=>{if(e.target.closest(".node,.desk,.anc,.zb,.tlbar"))return;pan={x:e.clientX-cam.x,y:e.clientY-cam.y};st.setPointerCapture(e.pointerId)});
st.addEventListener("pointermove",e=>{if(pan){cam.x=e.clientX-pan.x;cam.y=e.clientY-pan.y;camApply()}});st.addEventListener("pointerup",()=>pan=null);
const MODES=[['生成全部视频'],['采纳并生成'],['一键出片']];let mode=2,AP={on:false,fail:[],tasks:[]};
function mseg(){$('#mseg').innerHTML=['手动','半自动','全自动'].map((n,i)=>`<button class='${i===mode?'on':''}' onclick='setMode(${i})'>${n}</button>`).join('')}
function setMode(i){mode=i;mseg();R()}
function goBtn(){if(mode===2)openCf();else toast(mode===0?'弹出确认卡：模型、渠道、预计费用、完整提示词':'半自动：方案自动采纳，生成按批弹确认卡')}
function closeCf(){$('#cf').classList.remove('on')}
function openCf(){const rs=rows(),n=rs.length,t=rs.reduce((a,s)=>a+s.dur,0),fr=rs.filter(s=>s.mode==='首帧'&&!s.cont).length;
$('#cf').innerHTML=`<div class='md'><b style='font-size:13px'>一键出片 · 只确认这一次</b><div class='box'>${n} 镜 · ${t} 秒 · 1080×1920<br>${P.state==='pending'?'待处理的 Agent 方案会自动采纳':'沿用当前导演台'}</div><div class='kv'><span>首帧 / 视频</span><span>${fr} 张 / ${n} 条，每个最多重试 3 次</span></div><div class='kv'><span>配音 · 合成</span><span class='chip ok'>本机处理</span></div><label class='r g8'><input type='checkbox' checked> 自动质检：不合格自动重生，选最好的一版</label><label class='r g8'><input type='checkbox' checked> 审核失败时自动改写提示词重试一次</label><div class='r g4' style='justify-content:flex-end'><button class='gb' onclick='closeCf()'>取消</button><button class='pb' onclick='apStart()'>开始出片</button></div></div>`;$('#cf').classList.add('on')}
function apStart(){closeCf();if(P.state==='pending')apply();
S.forEach(s=>{s.f='idle';s.v='idle';s.q=null;s.rt=0;s.ver=[0,0]});
const tasks=[];S.forEach(s=>{if(s.mode==='首帧'&&!s.cont)tasks.push([s.id,'f']);tasks.push([s.id,'v'])});
AP={on:true,paused:false,done:false,i:-1,tasks,fail:[],tm:setInterval(apTick,650)};R();APR();setTimeout(fit,0)}
function apTick(){const p=AP;if(!p.on||p.paused)return;const n=p.tasks.length,cur=p.tasks[p.i];
if(cur){const s=S.find(x=>x.id===cur[0]),k=cur[1];
if(k==='v'&&s.id==='s4'){s.v='error';p.fail.push(s.id)}
else{s[k]='ok';s.ver=[1,1];if(k==='v'){s.q=[88,91,83,0,86,84][S.indexOf(s)]||85;if(s.id==='s3')s.rt=1}}}
p.i++;const nx=p.tasks[p.i];
if(nx){const s=S.find(x=>x.id===nx[0]);s[nx[1]]='loading';if(nx[1]==='v'&&s.cont)s.f='ok'}
else if(p.i>n+1){clearInterval(p.tm);p.done=true;setTimeout(fit,0)}
R();APR()}
function apCancel(){clearInterval(AP.tm);AP={on:false,fail:[],tasks:[]};APR();R();setTimeout(fit,0)}
function apSee(){pick(AP.fail[0]||sel)}
function apMsg(m){toast(m)}
function APR(){const e=$('#ap');if(!AP.on){e.classList.remove('on');return}
const n=AP.tasks.length,st=AP.i<n?'run':AP.i===n?'dub':AP.i===n+1?'cmp':'done',fin=AP.done;
const fT=S.filter(s=>s.mode==='首帧').length,fO=S.filter(s=>s.mode==='首帧'&&s.f==='ok').length,vO=S.filter(s=>s.v==='ok').length,vF=AP.fail.length;
const stp=(l,c,x)=>`<div class='stp ${c}'><span>${l}</span><span>${x}</span></div>`;
const steps=stp('方案','done','✓')+stp('首帧',fO===fT?'done':'act',fO+'/'+fT)+stp('视频',st!=='run'?(vF?'bad':'done'):'act',vO+'/'+S.length+(vF?' · '+vF+' 失败':''))+stp('配音',st==='dub'?'act':(st==='cmp'||st==='done')?'done':'','本机')+stp('合成',st==='cmp'?'act':st==='done'?'done':'','本机');
const btn=fin?`<button class='fb s' onclick='apSee()'>看失败镜头</button><button class='wb s' onclick="apMsg('确认卡：只重生失败的镜头')">只重生失败的</button><button class='gb' onclick="apMsg('预览拼接')">预览成片</button><button class='pb' style='padding:3px 9px' onclick="apMsg('合成成片（本机 ffmpeg）')">合成…</button>`:`<button class='gb' onclick='AP.paused=!AP.paused;APR()'>${AP.paused?'继续':'暂停'}</button><button class='fb s' onclick='apCancel()'>取消</button>`;
e.innerHTML=`<div class='r sb g8'><b>${fin?'已完成，请验收':AP.paused?'已暂停':'一键出片中…'}</b><span class='r g4'>${btn}</span></div><div class='steps'>${steps}</div>${fin?`<div class='mu'>完成 ${vO}/${S.length} 镜。镜 04 内容审核未通过，已自动改写提示词重试 1 次，仍失败，其余镜头不受影响；镜 03 质检 76，重试 1 次后 83。验收只在这里做一次。</div>`:''}`;e.classList.add('on')}
mseg();
let tt;function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("on"),2600)}
R();fit();
</script></body></html>
