  o+=`<button class="fb s bad" onclick="delH('${h.id}')">删除这个效果</button>`}
 else if(sel.k==="style"){const S=CV.style;
  o+=`<b>字幕样式</b><div class="mu">初始值来自拆解结果。</div><div class="lb">逐词高亮</div><div class="seg">${[["off","关"],["current","当前词"],["trail","已读拖尾"]].map(([k,n])=>`<button class="${S.kar===k?"on":""}" onclick="CV.style.kar='${k}';R1();P1()">${n}</button>`).join("")}</div><div class="lb">高亮色</div><input type="color" value="${S.color}" oninput="CV.style.color=this.value;P1()"><div class="lb"><span>垂直位置</span><span>${S.y}%</span></div><input type="range" min="50" max="88" value="${S.y}" oninput="CV.style.y=+this.value;P1();this.previousElementSibling.lastChild.textContent=this.value+'%'"><div class="lb">每行最多词数</div><select class="ms" onchange="CV.style.maxw=+this.value;P1()">${[2,3,4,5,6].map(n=>`<option ${n===S.maxw?"selected":""}>${n}</option>`).join("")}</select>`}
 else if(sel.k==="bgm")o+=`<b>BGM</b><div class="kv"><span>来源</span><span>我的素材 〈BGM 文件〉</span></div><div class="lb">音量</div><input type="range" min="0" max="100" value="28"><div class="kv"><span>淡入 / 淡出</span><span>0.6s / 0.8s</span></div><div class="fa">原片 BGM 不使用，只参考情绪。</div>`;
 e.innerHTML=o}
const h0=id=>HOOKS.find(x=>x.id===id);
function delH(id){HOOKS.splice(HOOKS.findIndex(x=>x.id===id),1);CV.sel={k:"style"};CW()}

/* ---- 变体抽屉 ---- */
function V1(){const e=$("#cwdrw");if(!e||CV.stage!==5)return;
 e.innerHTML=`<div class="r sb"><b>变体 · 一行一条成片</b><span class="r g4"><button class="fb s" onclick="CV.vars.push(['','人设 A','中文',''])">＋ 加一行</button><button class="pb" onclick="varPlan()">批量出片…</button></span></div><table class="vt"><tr><th>#</th><th>钩子（S1 台词）</th><th>人设</th><th>语言</th><th>受影响</th><th>状态</th></tr>${CV.vars.map((r,i)=>{const imp=i===0?"无（即当前版本）":r[2]!=="中文"?"全部 6 段重做":r[1]!=="人设 A"?"6 段主画面重做（人设变）":"S1 重做，其余复用";return `<tr><td>${i+1}</td><td><input value="${esc(r[0])}" oninput="CV.vars[${i}][0]=this.value"></td><td><input value="${esc(r[1])}" oninput="CV.vars[${i}][1]=this.value;V1()"></td><td><select class="ms" onchange="CV.vars[${i}][2]=this.value;V1()">${["中文","英文"].map(x=>`<option ${x===r[2]?"selected":""}>${x}</option>`).join("")}</select></td><td class="mu">${imp}</td><td>${r[3]?`<span class="chip ${r[3]==="失败"?"bad":r[3]==="已出片"?"ok":"run"}">${r[3]}</span>${r[3]==="失败"?` <button class="fb s" onclick="CV.vars[${i}][3]='已出片';V1()">重跑</button>`:""}`:'<span class="fa">—</span>'}</td></tr>`}).join("")}</table>`}

/* ---- 弹窗 ---- */
function md(h){$("#cf").innerHTML=`<div class="md mdl">${h}</div>`;$("#cf").classList.add("on")}
function anaCf(){const ok=$("#vch")&&$("#vch").value==="1";if(!ok){toast("该渠道格式不支持视频输入：请在设置 → 渠道里添加 gemini 格式、能读视频的模型");return}
 md(`<b style="font-size:13px">确认拆解</b><div class="kv"><span>将送出</span><span>${CV.refName?esc(CV.refName)+" · "+CV.refSize:"〈原片文件〉"}（画面 + 原声）</span></div><div class="kv"><span>模型</span><span>渠道 G（gemini 格式）· 多模态模型 1</span></div><div class="kv"><span>方式</span><span>先看整片，再逐段只送该段区间补细节</span></div><div class="warnbox">首次使用：原片会发给你配置的这个 gemini 渠道。用的若是免费层，按 Google 条款，内容可能被用于改进其产品。</div><div class="fa">点取消不会发出任何请求。</div><div class="r g4" style="justify-content:flex-end"><button class="gb" onclick="closeCf()">取消</button><button class="pb" onclick="anaRun()">送出并拆解</button></div>`)}
function anaRun(){md(`<b>拆解中</b><div class="box" id="ap1">① 看整片：分段、台词与说话人、钩子、语速、字幕样式、B-roll 与屏上文字和音效挂在哪些字上 <span class="chip run">进行中</span></div><div class="box" id="ap2">② 逐段补细节（每段只送该段区间）<span class="chip">等待</span></div>`);
 setTimeout(()=>{$("#ap1").lastChild.className="chip ok";$("#ap1").lastChild.textContent="完成";$("#ap2").lastChild.className="chip run";$("#ap2").lastChild.textContent="4/6 · 有一段看不清，已缩小区间加密帧重看"},900);
 setTimeout(()=>{closeCf();CV.analyzed=true;CV.stage=1;CV.sel={k:"seg",i:0};CW();toast("拆解完成：6 段、11 个挂点、字幕样式已写入复刻工程")},1900)}
function rewriteCf(){const rows=SEGS.map((s,i)=>`<label class="chg m" style="grid-template-columns:18px 34px 1fr"><input type="checkbox" checked data-i="${i}"><span class="k">${s.id}</span><div><s>${esc(s.old.map(tok).join(""))}</s><br>${esc(s.nw.map(tok).join(""))}${HOOKS.filter(h=>h.seg===i&&h.old!==h.nw).map(h=>`<div class="fa">${HN[h.k]}：${esc(h.old)} → <b style="color:${HC[h.k]}">${esc(h.nw)}</b>，挂到「${esc(s.nw.slice(h.a,h.b+1).map(tok).join(""))}」</div>`).join("")}</div></label>`).join("");
 md(`<b style="font-size:13px">改写方案 · 导演 Agent（渠道 A · 文本模型 1）</b><div class="mu">保留每段角色、句数、语速、钩子类型；挂点迁到新台词对应的字上。勾选决定采纳哪些段。</div>${rows}<div class="kv"><span>显示 / 念出</span><span>字幕显示的字与实际念出的字可以不同</span></div><div class="r g4" style="justify-content:flex-end"><button class="gb" onclick="closeCf()">不要</button><button class="pb" onclick="rewriteApply()">应用所选</button></div>`)}
function rewriteApply(){CV.bk=1;CV.rew=true;Object.keys(CV.gen).forEach(k=>{if(CV.gen[k]==="ok")CV.gen[k]="stale"});closeCf();CV.stage=2;CW();toast("已应用改写；挂点已迁到新台词。可一次撤销")}
function undoRew(){CV.rew=false;CV.bk=null;CW();toast("已撤销改写")}
function genPlan(only){const idx=only||SEGS.map((_,i)=>i);
 const items=[];idx.forEach(i=>{const s=SEGS[i],g=CV.gen[i];items.push([`${s.id} 主画面`,s.src!=="生成"?"用素材":g==="ok"&&!only?"复用":"新生成",s.src==="生成"?"渠道 B · 视频模型 1":"—",`〈人设〉…台词：“${words(i).map(spk).join("")}”`]);
  HOOKS.filter(h=>h.seg===i&&h.k==="broll").forEach(h=>items.push([`${s.id} B-roll`,h.asset?"用素材":CV.gen[i]==="ok"&&!only?"复用":"新生成",h.asset?"—":"渠道 A · 图片模型 1 → 渠道 B · 视频模型 1",hl(h)]))});
 const nNew=items.filter(x=>x[1]==="新生成").length,nRe=items.filter(x=>x[1]==="复用").length,nA=items.filter(x=>x[1]==="用素材").length;
 md(`<b style="font-size:13px">生成计划</b><div class="mu">新生成 ${nNew} 项 · 复用 ${nRe} 项 · 用素材 ${nA} 项。字幕、屏上文字、贴纸、音效不调模型。</div><div style="display:flex;flex-direction:column;gap:5px;max-height:46vh;overflow:auto">${items.map(x=>`<div class="box"><div class="r sb"><b>${x[0]}</b><span class="chip ${x[1]==="新生成"?"run":x[1]==="复用"?"ok":""}">${x[1]}</span></div><div class="mu">${esc(x[2])}</div><div>${esc(x[3])}</div></div>`).join("")}</div><div class="r g4" style="justify-content:flex-end"><button class="gb" onclick="closeCf()">取消</button><button class="pb" onclick="genRun([${idx}],${!!only})">确认生成</button></div>`)}
function genRun(idx,force){closeCf();const q=idx.filter(i=>force||CV.gen[i]!=="ok");q.forEach(i=>CV.gen[i]="loading");CV.stage=2;CW();
 q.forEach((i,n)=>setTimeout(()=>{CV.gen[i]="ok";CV.real[i]=+(est(i)*(0.9+((i*37)%20)/100)).toFixed(1);CV.alignFail[i]=i===3&&!force;if(q.every(j=>CV.gen[j]==="ok")){CV.stage=3;toast(CV.alignFail[3]?"全部生成完：已按真实语音逐词对齐；S4 对齐未通过，字幕整句显示":"已生成并对齐")}CW()},700*(n+1)))}
function renderCf(){if(!SEGS.every((_,i)=>CV.gen[i]==="ok")){genPlan();return}
 md(`<b style="font-size:13px">渲染成片</b><div class="kv"><span>画面</span><span>6 段主画面 · ${HOOKS.filter(h=>h.k==="broll").length} 条 B-roll</span></div><div class="kv"><span>图形层</span><span>字幕（${CV.style.kar==="trail"?"已读拖尾":CV.style.kar==="current"?"当前词":"无"}高亮）· 屏上文字 · 贴纸 → 无头 Chromium 透明层</span></div><div class="kv"><span>音频</span><span>人声（各段视频自带声音）+ BGM 28% + ${HOOKS.filter(h=>h.k==="sfx").length} 个音效</span></div><div class="kv"><span>合成</span><span class="chip ok">本机 ffmpeg · 可用</span></div><div class="fa">Web 版没有这一步，只有实时预览。</div><div class="r g4" style="justify-content:flex-end"><button class="gb" onclick="closeCf()">取消</button><button class="pb" onclick="renderRun()">开始渲染</button></div>`)}
function renderRun(){const st=["图形层（Chromium）","画面合成（ffmpeg）","混音","写出 MP4"];let k=0;
 const draw=()=>md(`<b>渲染中 · 构建 #${CV.built+1}</b>${st.map((s,i)=>`<div class="stp ${i<k?"done":i===k?"act":""}"><span>${s}</span><span>${i<k?"✓":""}</span></div>`).join("")}`);draw();
 const iv=setInterval(()=>{k++;if(k<st.length){draw();return}clearInterval(iv);CV.built++;
  md(`<b>成片已出 · 构建 #${CV.built}</b><div class="kv"><span>文件</span><span>〈工程名〉_v${CV.built}.mp4 · ${f1(total())} · 1080×1920</span></div><div class="kv"><span>本次</span><span>复用 ${6+HOOKS.filter(h=>h.k==="broll").length} 项素材，重新渲染图形层与混音</span></div><div class="mu">成片已落到画布：viral-clone 节点连出一个新视频节点。</div><div class="r g4" style="justify-content:flex-end"><button class="gb" onclick="toast('导出 zip：project.json、shots/、captions.srt、final.mp4、README.txt')">导出工程包</button><button class="gb" onclick="closeCf();goStage(5)">出变体</button><button class="pb" onclick="closeCf();CV.t=0;CW();tg()">播放成片</button></div>`)},700)}
function varPlan(){const rows=CV.vars.slice(1);md(`<b style="font-size:13px">批量出片 · 只确认这一次</b>${rows.map((r,i)=>{const all=r[2]!=="中文"||r[1]!=="人设 A";return `<div class="box"><b>变体 ${i+2}</b> · ${esc(r[0]||"（钩子不变）")} · ${esc(r[1])} · ${r[2]}<div class="mu">${all?"新生成 6 段主画面，复用 B-roll 与素材":"新生成 S1 主画面 1 项，复用其余 5 段与全部 B-roll"} · 渠道 B · 视频模型 1</div></div>`}).join("")}<div class="r g4" style="justify-content:flex-end"><button class="gb" onclick="closeCf()">取消</button><button class="pb" onclick="varRun()">开始</button></div>`)}
function varRun(){closeCf();CV.vars[0][3]="已出片";for(let i=1;i<CV.vars.length;i++)CV.vars[i][3]="生成中";V1();
 setTimeout(()=>{CV.vars[1][3]="已出片";V1()},900);setTimeout(()=>{CV.vars[2]&&(CV.vars[2][3]="失败");V1();toast("变体 3 失败：原文「内容审核未通过」；其余照常出片，可单独重跑")},1600);
 for(let i=3;i<CV.vars.length;i++)setTimeout(()=>{CV.vars[i][3]="已出片";V1()},1200+i*300)}
const _cc=closeCf;closeCf=function(){_cc()};

R();fit();
</script></body></html>
